<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOO Education | Sign in</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 8px 30px #0001;width:min(90%,380px)}label{display:block;margin-top:1rem;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.4rem;border:1px solid #ccd3df;border-radius:6px}button{margin-top:1.4rem;background:#1769aa;color:#fff;border:0;cursor:pointer}#message{color:#b42318;margin-top:1rem}</style>
</head>
<body><main class="card"><h1>Admin sign in</h1><p>Sign in to manage educational content and files.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button><div id="message" role="alert"></div></form></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message');const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json();if(response.ok)location.href='/admin.html';else message.textContent=data.error||'Sign in failed';});</script>
</body></html>
