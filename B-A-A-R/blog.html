<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet"/>
  <link rel="website icon" type="png" href="/images/logo6.png"/>
  <title>ZOO Education | Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <style>
    * {
      font-family: "Fredoka", sans-serif;
    }
    .blog-card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      transition: transform 0.3s ease;
      position: relative;
    }
    .blog-card:hover {
      transform: translateY(-5px);
    }
    .blog-image {
      height: 300px;
      object-fit: cover;
      border-radius: 15px 15px 0 0;
    }
    .new-badge {
      position: absolute;
      top: 15px;
      left: 1060px;
      background-color: #ff4757;
      color: white;
      padding: 5px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.8rem;
      z-index: 10;
    }
    .like-button {
      cursor: pointer;
      color: #eb0808;
      font-size: 1.2rem;
      user-select: none;
    }
    .like-button.liked {
      color: #dc3545;
    }
    .likes-count {
      margin-left: 8px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <img src="/images/logo6.png" alt="Logo" height="50"/>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/blog.html">Blog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/B-A-A-R/report.html">Report Issues</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <!-- Blog Post Form -->
    <div class="card blog-card mb-5" id="uploadFormCard" style="display: none;">
      <div class="card-body">
        <h3 class="card-title mb-4">Create New Blog Post</h3>
        <form id="blogForm">
          <div class="mb-3">
            <label for="blogTitle" class="form-label">Title</label>
            <input type="text" class="form-control" id="blogTitle" required />
          </div>

          <div class="mb-3">
            <label for="blogContent" class="form-label">Content</label>
            <textarea class="form-control" id="blogContent" rows="5" required></textarea>
          </div>
          <button id="postBlogBtn" class="btn btn-primary">Post Blog</button>
        </form>
      </div>
    </div>

    <!-- Blog Posts Section -->
    <div id="blogPosts">
      <!-- Existing posts go here -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h5>Contact Information</h5>
          <p><i class="fas fa-envelope"></i> info@zooeducation.com</p>
          <p><i class="fas fa-phone"></i> +92 300 1234567</p>
        </div>
        <div class="col-md-6 text-end">
          <h5>Follow Us</h5>
          <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
          <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
          <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
      <div class="text-center mt-3">
        <p>&copy; 2024 ZOO Education. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const isOwner = true; // Change to true to show the upload form for owners only

    if (isOwner) {
      document.getElementById("uploadFormCard").style.display = "block";
    }

    async function loadBlogPosts() {
      try {
        const response = await fetch('/api/blog-posts');
        if (!response.ok) {
          throw new Error('Failed to fetch blog posts');
        }
        let blogPosts = await response.json();
        // Sort posts by postTime descending (newest first)
        blogPosts.sort((a, b) => b.postTime - a.postTime);

        const blogPostsContainer = document.getElementById('blogPosts');
        blogPostsContainer.innerHTML = '';

        const now = Date.now();
        const oneDayMs = 24 * 60 * 60 * 1000;

        console.log('Loaded blog posts:', blogPosts);
        blogPosts.forEach(post => {
          console.log('Post _id:', post._id);
          const blogPost = document.createElement('div');
          blogPost.className = 'card blog-card';

          const imgHTML = post.imageFilename
            ? `<img src="/B-A-A-R/blog-uploads/${post.imageFilename}" class="blog-image" alt="Blog Image">`
            : '';

          // Check if post is new (within 24 hours)
          const isNew = (now - post.postTime) <= oneDayMs;
          const newBadgeHTML = isNew ? `<div class="new-badge">New</div>` : '';

          // Like button and count
          const likesCount = post.likes || 0;
          const likeButtonHTML = `
            <span class="like-button" data-id="${post._id}" title="Like">
              <i class="fas fa-heart"></i>
            </span>
            <span class="likes-count">${likesCount}</span>
          `;

          blogPost.innerHTML = `
            ${imgHTML}
            ${newBadgeHTML}
            <div class="card-body">
              <h3 class="card-title">${post.title}</h3>
              <p class="card-text text-muted">Posted by Admin on ${new Date(post.postTime).toLocaleDateString()}</p>
              <p class="card-text">${post.content}</p>
              <div>${likeButtonHTML}</div>
            </div>
          `;

          blogPostsContainer.appendChild(blogPost);
        });

        // Add event listeners for like buttons
        document.querySelectorAll('.like-button').forEach(button => {
          button.addEventListener('click', async () => {
            const postId = button.getAttribute('data-id');
            try {
              const res = await fetch(`/like-blog-post/${postId}`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                }
              });
              if (res.ok) {
                // Reload posts to update likes count
                await loadBlogPosts();
              } else {
                const errorData = await res.json();
                alert('Failed to like the post: ' + (errorData.error || 'Unknown error'));
              }
            } catch (error) {
              alert('Error liking the post: ' + error.message);
            }
          });
        });

      } catch (error) {
        console.error('Error loading blog posts:', error);
      }
    }

    document.getElementById('postBlogBtn').addEventListener('click', async function () {
      const password = prompt("Enter password:");
      if (password !== "zufi0514") {
        alert("Incorrect password");
        return;
      }

      const title = document.getElementById('blogTitle').value;
      const content = document.getElementById('blogContent').value;
      const postTime = Date.now();

      // Send blog post data to backend
      try {
        const postResponse = await fetch('/submit-blog-post', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title,
            content,
            imageFilename: '',
            postTime
          })
        });
        const postResult = await postResponse.json();
        if (postResponse.ok) {
          // Reload blog posts to include the new one
          await loadBlogPosts();
          document.getElementById('blogForm').reset();
        } else {
          alert('Failed to submit blog post: ' + postResult.message);
        }
      } catch (error) {
        alert('Error submitting blog post: ' + error.message);
      }
    });

    // Load blog posts on page load
    window.addEventListener('DOMContentLoaded', loadBlogPosts);
  </script>
</body>
</html>
