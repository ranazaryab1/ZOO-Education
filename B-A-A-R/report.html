<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="website icon" type="png" href="/images/logo6.png">
    <title>ZOO Education | Report Issues</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            font-family: "Fredoka", sans-serif;
        }
        .report-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        .report-card:hover {
            transform: translateY(-5px);
        }
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
        .btn-submit {
            background-color: #dc3545;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #bb2d3b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <img src="/images/logo6.png" alt="Logo" height="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/B-A-A-R/report.html">Report Issues</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card report-card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4"><i class="fas fa-exclamation-circle text-danger"></i> Report an Issue</h3>
<form id="issueForm" method="POST" action="/submit-report" enctype="application/json">
                            <!-- Student Information -->
                            <div class="mb-4">
                                <h5 class="mb-3">Student Information</h5>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="studentName" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="studentName" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="studentEmail" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="studentEmail" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="studentId" class="form-label">Student ID | ID(0000)</label>
                                        <input type="text" class="form-control" id="studentId" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="contactNumber" class="form-label">Contact Number</label>
                                        <input type="tel" class="form-control" id="contactNumber" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Issue Details -->
                            <div class="mb-4">
                                <h5 class="mb-3">Issue Details</h5>
                                <div class="mb-3">
                                    <label for="issueType" class="form-label">Type of Issue</label>
                                    <select class="form-select" id="issueType" required>
                                        <option value="">Select issue type</option>
                                        <option value="academic">Academic Issue</option>
                                        <option value="technical">Technical Issue</option>
                                        <option value="administrative">Administrative Issue</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="issueTitle" class="form-label">Issue Title</label>
                                    <input type="text" class="form-control" id="issueTitle" required>
                                </div>
                                <div class="mb-3">
                                    <label for="issueDescription" class="form-label">Detailed Description</label>
                                    <textarea class="form-control" id="issueDescription" rows="4" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority Level</label>
                                    <select class="form-select" id="priority" required>
                                        <option value="">Select priority</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="urgent">Urgent</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Additional Information -->
                            <div class="mb-4">
                                <h5 class="mb-3">Additional Information</h5>
                                <div class="mb-3">
                                    <label for="affectedArea" class="form-label">Affected Area/Subject</label>
                                    <input type="text" class="form-control" id="affectedArea">
                                </div>
                                <div class="mb-3">
                                    <label for="dateOccurred" class="form-label">Date Issue Occurred</label>
                                    <input type="date" class="form-control" id="dateOccurred">
                                </div>
                                <div class="mb-3">
                                    <label for="attachments" class="form-label">Attachments (if any)</label>
                                    <input type="file" class="form-control" id="attachments" multiple>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-submit btn-lg px-5">
                                    <i class="fas fa-paper-plane me-2"></i>Submit Report
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>Contact Information</h5>
                    <p><i class="fas fa-envelope"></i> support@zooeducation.com</p>
                    <p><i class="fas fa-phone"></i> +92 300 1234567</p>
                </div>
                <div class="col-md-6 text-end">
                    <h5>Follow Us</h5>
                    <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            <div class="text-center mt-3">
                <p>&copy; 2024 ZOO Education. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Removed client-side submitIssue function to allow normal form submission
    </script>
</body>
</html>
