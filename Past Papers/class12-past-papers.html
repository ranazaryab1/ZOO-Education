    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Function to create past paper card
        function createPastPaperCard(paper) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'col-md-6';
            cardDiv.innerHTML = `
                <div class="book-card d-flex">
                    <img src="https://via.placeholder.com/100x150" alt="${paper.title}" class="book-cover">
                    <div class="book-info">
                        <h5 class="book-title">${paper.title}</h5>
                        <p class="book-board">Class ${paper.class}</p>
                        <p class="book-author">Subject: ${paper.subject}</p>
                        <button class="download-btn" onclick="downloadPastPaper('${paper.filename}')">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>
            `;
            return cardDiv;
        }

        // Helper function to map subject names to tab IDs
        function getSubjectId(subject) {
            const subjectMap = {
                'English': 'english',
                'Mathematics': 'math',
                'Physics': 'physics',
                'Chemistry': 'chemistry',
                'Biology': 'biology'
            };
            return subjectMap[subject] || 'english'; // Default to english if not found
        }

        // Function to download past paper
        function downloadPastPaper(filename) {
            const link = document.createElement('a');
            link.href = `/download/past-paper/${filename}`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Function to load past papers dynamically
        function loadPastPapers() {
            fetch('/api/past-paper-posts?class=12')
                .then(response => response.json())
                .then(data => {
                    // Clear existing dynamic content
                    document.querySelectorAll('.dynamic-cards').forEach(container => {
                        container.innerHTML = '';
                    });

                    // Group past papers by subject
                    const subjects = {};
                    data.forEach(paper => {
                        if (!subjects[paper.subject]) {
                            subjects[paper.subject] = [];
                        }
                        subjects[paper.subject].push(paper);
                    });

                    // Update each subject section
                    Object.keys(subjects).forEach(subject => {
                        const subjectId = getSubjectId(subject);
                        const container = document.querySelector(`#${subjectId} .dynamic-cards`);
                        if (container) {
                            subjects[subject].forEach(paper => {
                                const card = createPastPaperCard(paper);
                                container.appendChild(card);
                            });
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading past papers:', error);
                });
        }

        // Load past papers on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPastPapers();
        });


    </script>
