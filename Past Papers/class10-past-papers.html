        }
        .program-section {

        }
        .program-title {
            color: #dc3545;
            margin-bottom: 20px;

            border-bottom: 2px solid #dc3545;
        }
        /* Upload Section Styling */
        .upload-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .upload-section h3 {
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            font-weight: 600;
        }
        .upload-section .form-label {
            color: white;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .upload-section .form-control {
            background-color: rgba(255,255,255,0.9);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 12px 15px;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .upload-section .form-control:focus {
            background-color: white;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }
        .upload-section .form-select {
            background-color: rgba(255,255,255,0.9);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 12px 15px;
            color: #333;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .upload-section .form-select:focus {
            background-color: white;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }
        .upload-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .upload-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .upload-btn:hover::before {
            left: 100%;
        }
        .upload-btn:hover {
            background: linear-gradient(45deg, #218838, #17a2b8);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
        }
        .upload-btn:active {
            transform: translateY(-1px);
        }
        .upload-btn i {
            margin-right: 8px;
            font-size: 18px;
        }
    </style>
</head>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Class 10 Past Papers</h1>

        <!-- Search Box -->
        <div class="search-box">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Search past papers...">
                <button class="btn btn-danger" type="button">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h3 class="text-center mb-4"><i class="fas fa-upload program-icon"></i>Upload Past Paper</h3>
            <form id="uploadFormClass10PastPapers">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="subjectClass10PastPapers" class="form-label">Subject</label>
                        <select class="form-select" id="subjectClass10PastPapers" required>
                            <option value="">Select Subject</option>
                            <option value="English">English</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Science">Science</option>
                            <option value="Social Studies">Social Studies</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="titleClass10PastPapers" class="form-label">Past Paper Title</label>
                        <input type="text" class="form-control" id="titleClass10PastPapers" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="fileClass10PastPapers" class="form-label">Past Paper File</label>
                    <input type="file" class="form-control" id="fileClass10PastPapers" accept=".pdf,.docx" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="upload-btn">
                        <i class="fas fa-upload"></i> Upload Past Paper
                    </button>
                </div>
            </form>
        </div>

        <!-- Subject Tabs -->
        <ul class="nav nav-tabs mb-4" id="subjectTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="english-tab" data-bs-toggle="tab" data-bs-target="#english" type="button">
                    <i class="fas fa-language subject-icon"></i> English
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="math-tab" data-bs-toggle="tab" data-bs-target="#math" type="button">
                    <i class="fas fa-square-root-alt subject-icon"></i> Mathematics
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="science-tab" data-bs-toggle="tab" data-bs-target="#science" type="button">
                    <i class="fas fa-flask subject-icon"></i> Science
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="social-tab" data-bs-toggle="tab" data-bs-target="#social" type="button">

        <div class="tab-content" id="subjectTabsContent">

                    <h3 class="text-center mb-4"><i class="fas fa-language subject-icon"></i> English Past Papers</h3>
                    <div class="row dynamic-cards">

                    </div>
                </div>
            </div>

            <!-- Mathematics Section -->
            <div class="tab-pane fade" id="math" role="tabpanel">
                <div class="subject-section">
                    <h3 class="text-center mb-4"><i class="fas fa-square-root-alt subject-icon"></i> Mathematics Past Papers</h3>
                    <div class="row dynamic-cards">
                        <!-- Dynamic cards will be loaded here -->
                    </div>
                </div>

            <!-- Science Section -->

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function downloadBook(subject, type) {
            // Map subject and type to filename
            const filename = `${subject}-${type}.pdf`;
            // Trigger download from backend
            window.location.href = `/download/past-paper/${filename}`;
        }


    </script>
    <script>
        async function fetchPastPapers() {
            try {
                const response = await fetch('/api/past-paper-posts?class=10');
                const pastPapers = await response.json();
                console.log('Fetched past papers:', pastPapers);
                renderPastPapers(pastPapers);
            } catch (error) {
                console.error('Error fetching past papers:', error);
            }
        }

        function renderPastPapers(pastPapers) {
            console.log('Rendering past papers:', pastPapers);
            const subjects = ['English', 'Mathematics', 'Science', 'Social Studies'];
            const subjectSections = {};

            subjects.forEach(subject => {
                const subjectId = getSubjectId(subject);
                subjectSections[subject] = document.querySelector(`#${subjectId} .dynamic-cards`);
                subjectSections[subject].innerHTML = '';
            });

            pastPapers.forEach(paper => {
                console.log('Processing paper:', paper);
                const subject = paper.subject;
                // Additional safeguard: ensure paper is for class 10
                if (paper.class !== '10') {
                    console.warn('Skipping paper not for class 10:', paper);
                    return;
                }
                if (subjectSections[subject]) {
                    const card = document.createElement('div');
                    card.className = 'col-md-6 book-card d-flex align-items-center';

                    card.innerHTML = `
                        <img src="/images/logo6.png" alt="Past Paper" class="book-cover" />
                        <div class="book-info">
                            <h5 class="book-title">${paper.title}</h5>
                            <p class="book-board">Class ${paper.class}</p>
                            <p class="book-author">Subject: ${paper.subject}</p>
                            <button class="download-btn" onclick="downloadPastPaper('${paper.filename}')">
                                <i class="fas fa-download"></i> Download
                            </button>
                        </div>
                    `;

                    subjectSections[subject].appendChild(card);
                    console.log('Added card for subject:', subject);
                } else {
                    console.warn('No section found for subject:', subject);
                }
            });
        }

        // Helper function to map subject names to tab IDs
        function getSubjectId(subject) {
            const subjectMap = {
                'English': 'english',
                'Mathematics': 'math',
                'Science': 'science',
                'Social Studies': 'social'
            };
            return subjectMap[subject] || 'english'; // Default to english if not found
        }

        function downloadPastPaper(filename) {
            window.location.href = `/download/past-paper/${filename}`;
        }

        // Update upload form to submit to server
        document.getElementById('uploadFormClass10PastPapers').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Password check
            const password = prompt("Enter password to upload:");
            if (password !== "zoo0514") {
                alert("Incorrect password.");
                return;
            }

            const subject = document.getElementById('subjectClass10PastPapers').value;
            const title = document.getElementById('titleClass10PastPapers').value;
            const fileInput = document.getElementById('fileClass10PastPapers');
            const file = fileInput.files[0];

            if (!subject || !title || !file) {
                alert('Please fill in all fields and select a file.');
                return;
            }

            const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
            if (!allowedTypes.includes(file.type)) {
                alert('Please upload a PDF, DOC, or DOCX file.');
                return;
            }

            const maxSize = 10 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('File size must be less than 10MB.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // Show loading state
            const submitBtn = this.querySelector('.upload-btn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            submitBtn.disabled = true;

            try {
                // Upload file
                const uploadResponse = await fetch('/upload/past-paper', {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error('File upload failed');
                }

                const uploadResult = await uploadResponse.json();
                const filename = uploadResult.filename;

                // Submit metadata
                const pastPaperData = {
                    class: '10',
                    subject,
                    title,
                    filename
                };

                const submitResponse = await fetch('/submit-past-paper-post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pastPaperData)
                });

                if (!submitResponse.ok) {
                    throw new Error('Failed to save past paper data');
                }

                const submitResult = await submitResponse.json();
                alert(submitResult.message);

                // Reset form and refresh list
                this.reset();
                fetchPastPapers();
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // Fetch past papers on page load
        document.addEventListener('DOMContentLoaded', fetchPastPapers);
    </script>
</body>
